# 配置模板 —— 复制本文件为 application-local.properties 并填入真实值
# application-local.properties 已被 .gitignore 排除，请勿提交真实密钥

# 数据库账号密码
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password

# JWT 签名密钥（至少 32 字节，生产环境务必使用强随机值）
jwt.secret=replace-with-a-strong-random-secret-at-least-32-bytes
