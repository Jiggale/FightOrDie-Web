spring.application.name=fod-backend

# 激活本地配置（application-local.properties 已加入 .gitignore，存放真实密钥）
spring.profiles.active=local

# MySQL 数据源（敏感项通过环境变量注入，见 application-local.properties）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fod?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT 签名密钥（必须通过环境变量提供，禁止硬编码）
jwt.secret=${JWT_SECRET}

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.fod.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 日志
logging.level.com.fod=DEBUG
